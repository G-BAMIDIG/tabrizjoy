<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://azdjpfciniooumaycaqk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ZGpwZmNpbmlvb3VtYXljYXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTg3NjUsImV4cCI6MjEwNTkzNDc2NX0.wMySkMtIm6ulLU7sB5qRCLdsNiH2ALIN80iFJDpjZk0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const map = L.map('map').setView([38.0800, 46.2919], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    L.circleMarker([pos.coords.latitude, pos.coords.longitude], {
      radius: 8, color: '#1b6f6a', fillColor:'#1b6f6a', fillOpacity:0.9, weight:2
    }).addTo(map).bindPopup("موقعیت شما");
  });
}

let allPlaces = [], categories = [], activeCategoryEn = "";
let markersLayer = L.layerGroup().addTo(map);

async function loadCategories() {
  const { data } = await sb.from('categories').select('*');
  categories = data || [];
}

async function loadPlaces() {
  const { data, error } = await sb.from('places').select('*, categories(name_en)').eq('is_active', true);
  if (error) { console.error(error); return; }
  allPlaces = data || [];
  renderMarkers();
}

function renderMarkers() {
  markersLayer.clearLayers();
  let filtered = allPlaces;
  if (activeCategoryEn) filtered = filtered.filter(p => p.categories?.name_en === activeCategoryEn);

  filtered.forEach(p => {
    const marker = L.marker([p.lat, p.lng]);
    const igLink = p.instagram ? `<a href="https://instagram.com/${p.instagram.replace('@','')}" target="_blank">اینستاگرام</a>` : '';
    const photo = p.cover_photo_url ? `<img class="cover" src="${p.cover_photo_url}">` : '';
    marker.bindPopup(`
      <div class="popup-card">
        ${photo}
        <h3>${p.name}</h3>
        <p class="meta">${p.caption || ''}</p>
        <p class="meta">${p.phone || ''}</p>
        <p class="meta">${p.address || ''}</p>
        ${igLink}
      </div>
    `);
    markersLayer.addLayer(marker);
  });
  document.getElementById('count').textContent = `${filtered.length} مکان`;
}

document.querySelectorAll('.icon-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
    if (activeCategoryEn === btn.dataset.cat) { activeCategoryEn = ""; }
    else { activeCategoryEn = btn.dataset.cat; btn.classList.add('active'); }
    renderMarkers();
  });
});
document.getElementById('clearBtn').addEventListener('click', () => {
  activeCategoryEn = "";
  document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
  renderMarkers();
});

loadCategories();
loadPlaces();
</script>
</body>
