<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabrizJoy Admin</title>
<style>
  * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
  body { margin:0; background:#f4f0fb; }
  header { background:#6b2fb3; color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  #loginBox { max-width:340px; margin:80px auto; background:#fff; padding:24px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  #loginBox input { width:100%; padding:10px; margin:6px 0; border:1px solid #ddd; border-radius:6px; }
  #loginBox button, .actionBtn { background:#6b2fb3; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; }
  #app { display:none; max-width:900px; margin:20px auto; padding:0 16px; }
  .card { background:#fff; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .card h2 { margin-top:0; font-size:16px; }
  .card input, .card select, .card textarea { width:100%; padding:8px; margin:5px 0; border:1px solid #ddd; border-radius:6px; }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  th, td { text-align:right; padding:6px; border-bottom:1px solid #eee; }
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; }
  .paid { background:#dcfce7; color:#166534; }
  .unpaid { background:#fee2e2; color:#991b1b; }
  .rowActions button { font-size:12px; padding:4px 8px; margin-inline-end:4px; }
  #logoutBtn { background:#fff; color:#6b2fb3; border:1px solid #fff; padding:6px 12px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>ورود ادمین</h2>
  <input id="email" type="email" placeholder="ایمیل">
  <input id="password" type="password" placeholder="رمز عبور">
  <button onclick="login()">ورود</button>
  <p id="loginError" style="color:red;font-size:13px;"></p>
</div>

<div id="app">
  <header>
    <h1 style="font-size:18px;margin:0;">پنل مدیریت TabrizJoy</h1>
    <button id="logoutBtn" onclick="logout()">خروج</button>
  </header>

  <div style="max-width:900px;margin:16px auto;padding:0 16px;">

    <div class="card">
      <h2>افزودن دسته‌بندی</h2>
      <input id="catFa" placeholder="نام فارسی (مثلا: کافه)">
      <input id="catEn" placeholder="نام انگلیسی (cafe)">
      <input id="catIcon" placeholder="لینک آیکون (اختیاری)">
      <button class="actionBtn" onclick="addCategory()">افزودن دسته</button>
    </div>

    <div class="card">
      <h2>افزودن / ویرایش مکان</h2>
      <input type="hidden" id="placeId">
      <input id="pName" placeholder="نام مکان">
      <select id="pCategory"></select>
      <input id="pCaption" placeholder="کپشن کوتاه">
      <textarea id="pDescription" placeholder="توضیحات"></textarea>
      <input id="pPhone" placeholder="شماره تماس">
      <input id="pInstagram" placeholder="آیدی اینستاگرام">
      <input id="pAddress" placeholder="آدرس">
      <input id="pLat" placeholder="عرض جغرافیایی (lat)">
      <input id="pLng" placeholder="طول جغرافیایی (lng)">
      <select id="pBucket">
        <option value="budget">اقتصادی</option>
        <option value="mid">متوسط</option>
        <option value="high">بالا</option>
        <option value="premium">لوکس</option>
      </select>
      <input id="pPrice" placeholder="میانگین قیمت (تومان)">
      <input id="pCover" placeholder="لینک عکس اصلی">
      <button class="actionBtn" onclick="savePlace()">ذخیره مکان</button>
    </div>

    <div class="card">
      <h2>مکان‌ها و وضعیت اشتراک</h2>
      <table id="placesTable">
        <thead><tr><th>نام</th><th>دسته</th><th>وضعیت پرداخت</th><th>عملیات</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card">
      <h2>ثبت پرداخت اشتراک</h2>
      <select id="subPlace"></select>
      <input id="subAmount" placeholder="مبلغ (تومان)">
      <input id="subPaidAt" type="date">
      <input id="subPeriodStart" type="date" placeholder="شروع دوره">
      <input id="subPeriodEnd" type="date" placeholder="پایان دوره">
      <input id="subReceipt" placeholder="لینک عکس رسید">
      <input id="subNotes" placeholder="یادداشت">
      <button class="actionBtn" onclick="addSubscription()">ثبت پرداخت</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://azdjpfciniooumaycaqk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ImtDa5wKUtUeymxDeTj98Q_PYRtJH9W";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let categories = [];
let places = [];

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showApp();
}

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('loginError').textContent = "ایمیل یا رمز اشتباه است"; return; }
  showApp();
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

function showApp() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadCategories();
  loadPlaces();
}

async function loadCategories() {
  const { data } = await sb.from('categories').select('*').order('name_fa');
  categories = data || [];
  const sel = document.getElementById('pCategory');
  sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.name_fa}</option>`).join('');
}

async function addCategory() {
  const name_fa = document.getElementById('catFa').value;
  const name_en = document.getElementById('catEn').value;
  const icon_url = document.getElementById('catIcon').value;
  if (!name_fa) return alert("نام فارسی الزامی است");
  await sb.from('categories').insert({ name_fa, name_en, icon_url });
  document.getElementById('catFa').value = '';
  document.getElementById('catEn').value = '';
  document.getElementById('catIcon').value = '';
  loadCategories();
}

async function savePlace() {
  const id = document.getElementById('placeId').value;
  const payload = {
    name: document.getElementById('pName').value,
    category_id: document.getElementById('pCategory').value,
    caption: document.getElementById('pCaption').value,
    description: document.getElementById('pDescription').value,
    phone: document.getElementById('pPhone').value,
    instagram: document.getElementById('pInstagram').value,
    address: document.getElementById('pAddress').value,
    lat: parseFloat(document.getElementById('pLat').value),
    lng: parseFloat(document.getElementById('pLng').value),
    price_bucket: document.getElementById('pBucket').value,
    price_avg_toman: parseInt(document.getElementById('pPrice').value) || null,
    cover_photo_url: document.getElementById('pCover').value,
  };
  if (!payload.name || isNaN(payload.lat) || isNaN(payload.lng)) return alert("نام و مختصات الزامی است");

  if (id) {
    await sb.from('places').update(payload).eq('id', id);
  } else {
    await sb.from('places').insert(payload);
  }
  document.getElementById('placeId').value = '';
  ['pName','pCaption','pDescription','pPhone','pInstagram','pAddress','pLat','pLng','pPrice','pCover']
    .forEach(id => document.getElementById(id).value = '');
  loadPlaces();
}

async function loadPlaces() {
  const { data } = await sb.from('places').select('*, categories(name_fa)').order('created_at', {ascending:false});
  places = data || [];

  const subSel = document.getElementById('subPlace');
  subSel.innerHTML = places.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

  const { data: subs } = await sb.from('subscriptions').select('*').order('paid_at', {ascending:false});

  const tbody = document.querySelector('#placesTable tbody');
  tbody.innerHTML = places.map(p => {
    const lastSub = (subs || []).find(s => s.place_id === p.id);
    const today = new Date().toISOString().slice(0,10);
    const isPaid = lastSub && lastSub.period_end >= today;
    return `<tr>
      <td>${p.name}</td>
      <td>${p.categories?.name_fa || '-'}</td>
      <td><span class="badge ${isPaid ? 'paid' : 'unpaid'}">${isPaid ? 'پرداخت شده تا ' + lastSub.period_end : 'پرداخت نشده'}</span></td>
      <td class="rowActions">
        <button onclick="editPlace('${p.id}')">ویرایش</button>
        <button onclick="deletePlace('${p.id}')">حذف</button>
      </td>
    </tr>`;
  }).join('');
}

function editPlace(id) {
  const p = places.find(x => x.id === id);
  document.getElementById('placeId').value = p.id;
  document.getElementById('pName').value = p.name || '';
  document.getElementById('pCategory').value = p.category_id || '';
  document.getElementById('pCaption').value = p.caption || '';
  document.getElementById('pDescription').value = p.description || '';
  document.getElementById('pPhone').value = p.phone || '';
  document.getElementById('pInstagram').value = p.instagram || '';
  document.getElementById('pAddress').value = p.address || '';
  document.getElementById('pLat').value = p.lat || '';
  document.getElementById('pLng').value = p.lng || '';
  document.getElementById('pBucket').value = p.price_bucket || 'mid';
  document.getElementById('pPrice').value = p.price_avg_toman || '';
  document.getElementById('pCover').value = p.cover_photo_url || '';
  window.scrollTo(0,0);
}

async function deletePlace(id) {
  if (!confirm("حذف شود؟")) return;
  await sb.from('places').delete().eq('id', id);
  loadPlaces();
}

async function addSubscription() {
  const payload = {
    place_id: document.getElementById('subPlace').value,
    amount_toman: parseInt(document.getElementById('subAmount').value),
    paid_at: document.getElementById('subPaidAt').value,
    period_start: document.getElementById('subPeriodStart').value,
    period_end: document.getElementById('subPeriodEnd').value,
    receipt_photo_url: document.getElementById('subReceipt').value,
    notes: document.getElementById('subNotes').value,
  };
  if (!payload.place_id || !payload.amount_toman || !payload.paid_at || !payload.period_start || !payload.period_end) {
    return alert("همه فیلدهای ضروری را پر کنید");
  }
  await sb.from('subscriptions').insert(payload);
  ['subAmount','subPaidAt','subPeriodStart','subPeriodEnd','subReceipt','subNotes'].forEach(id => document.getElementById(id).value = '');
  loadPlaces();
}

checkSession();
</script>
</body>
</html>
